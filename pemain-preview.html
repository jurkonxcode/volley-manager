<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pratinjau Pemain 3D</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
html,body{margin:0;height:100%;background:#070a14;overflow:hidden;font:700 14px system-ui;color:#eef1fa}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(transparent,rgba(7,10,20,.92) 40%)}
button{font:inherit;padding:9px 14px;border-radius:8px;border:0;background:#182036;color:#eef1fa}
button.p{background:#c6ff3d;color:#0a1200}
#i{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);padding:8px 12px;background:rgba(7,10,20,.8);border-radius:8px;font-weight:600}
</style></head>
<body><div id="i">Seret = putar · cubit/scroll = zoom</div><div id="bar"></div>
<script type="module">
import * as T from 'three';
import { createPlayerGaya, RAMBUT_WARNA } from './js/tiga-d/player-gaya.js';
const R = new T.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 1.5)); R.setSize(innerWidth, innerHeight);
R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.12; R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap; document.body.appendChild(R.domElement);
const sc = new T.Scene(); sc.background = new T.Color(0x101c2d);
sc.add(new T.HemisphereLight(0xd8eaff, 0x293348, 2.25));
const k = new T.DirectionalLight(0xfff1d7, 2.65); k.position.set(-6, 12, 8); k.castShadow = true; k.shadow.mapSize.set(1024, 1024); Object.assign(k.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 }); sc.add(k);
const rim = new T.DirectionalLight(0x83baff, .9); rim.position.set(6, 6, -8); sc.add(rim);
const lantai = new T.Mesh(new T.PlaneGeometry(40, 40), new T.MeshStandardMaterial({ color: 0xc9873f, roughness: .8 })); lantai.rotation.x = -Math.PI / 2; lantai.receiveShadow = true; sc.add(lantai);
// Tiga pemain: tim kita (jersey merah), lawan (biru), libero (kuning otomatis).
const kulit = [0xF1C9A5, 0xE0A878, 0xC68642, 0x8D5524];
const daftar = [[-1.8, 'OH', 0xB51F35, 0, 0], [0, 'S', 0xB51F35, 1, 1], [1.8, 'L', 0xB51F35, 2, 2]].map(([x, role, jc, i, h], n) => {
  const g = createPlayerGaya(T, { number: [7, 3, 12][n], role, jerseyColor: jc, skinColor: kulit[i], hair: h, hairColor: RAMBUT_WARNA[i], scale: 1.4 });
  g.position.x = x; sc.add(g); return g;
});
const aksi = ['terima', 'servis', 'umpan', 'smash', 'blok', 'lompat', 'rayakan', 'kecewa'];
const bar = document.getElementById('bar');
aksi.forEach(a => { const b = document.createElement('button'); b.textContent = a; b.onclick = () => daftar.forEach((g, i) => setTimeout(() => { g.userData.main(a); if (['lompat', 'smash', 'blok', 'servis', 'rayakan'].includes(a)) loncat(g, a); }, i * 90)); bar.appendChild(b); });
const mati = document.createElement('button'); mati.className = 'p'; mati.textContent = 'garis tepi on/off'; bar.appendChild(mati);
// Gerak naik-turun sederhana untuk aksi lompat (di game dilakukan oleh arena3d).
const naik = []; function loncat(g, a) { naik.push({ g, t: 0, d: a === 'rayakan' ? 1.1 : .6, h: a === 'servis' ? .5 : a === 'rayakan' ? .5 : 1.1 }); }
const cam = new T.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100); let yaw = .5, pit = .22, dist = 9, down = null;
const pos = () => { cam.position.set(Math.sin(yaw) * Math.cos(pit) * dist, Math.sin(pit) * dist + 1.6, Math.cos(yaw) * Math.cos(pit) * dist); cam.lookAt(0, 1.7, 0); };
addEventListener('pointerdown', e => { if (e.target.closest('#bar')) return; down = [e.clientX, e.clientY]; }); addEventListener('pointerup', () => down = null);
addEventListener('pointermove', e => { if (!down) return; yaw -= (e.clientX - down[0]) * .008; pit = Math.max(-.05, Math.min(1.2, pit + (e.clientY - down[1]) * .004)); down = [e.clientX, e.clientY]; });
addEventListener('wheel', e => dist = Math.max(4, Math.min(20, dist + e.deltaY * .01)));
let jarak0 = 0; addEventListener('touchmove', e => { if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (jarak0) dist = Math.max(4, Math.min(20, dist - (d - jarak0) * .03)); jarak0 = d; } }, { passive: true }); addEventListener('touchend', () => jarak0 = 0);
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
let garis = true; mati.onclick = () => { garis = !garis; daftar.forEach(g => g.traverse(o => { if (o.isMesh && o.material.side === T.BackSide) o.visible = garis; })); };
let t0 = performance.now(); (function f(n) { const dt = Math.min((n - t0) / 1000, .05); t0 = n;
  for (let i = naik.length - 1; i >= 0; i--) { const a = naik[i]; a.t += dt; const k = Math.min(a.t / a.d, 1); a.g.position.y = Math.sin(k * Math.PI) * a.h; if (k >= 1) naik.splice(i, 1); }
  daftar.forEach(g => g.userData.mixer.update(dt)); pos(); R.render(sc, cam); requestAnimationFrame(f); })(t0);
</script></body></html>
