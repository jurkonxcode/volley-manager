<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pratinjau Stadion Pro</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>html,body{margin:0;height:100%;background:#070a14;overflow:hidden;font:600 14px system-ui;color:#eef1fa}#i{position:fixed;left:10px;top:10px;padding:8px 12px;background:rgba(7,10,20,.8);border-radius:8px}button{font:inherit;margin-left:8px;padding:4px 10px;border-radius:6px;border:0;background:#c6ff3d;color:#0a1200}</style></head>
<body><div id="i">Seret untuk memutar · cubit/scroll untuk zoom <button id="h">Sorak!</button></div>
<script type="module">
import * as T from 'three'; import { createArena } from './js/tiga-d/arena.js';
const R = new T.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 1.5)); R.setSize(innerWidth, innerHeight); R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.1; R.shadowMap.enabled = true; document.body.appendChild(R.domElement);
const sc = new T.Scene(); sc.background = new T.Color(0x101c2d); sc.fog = new T.Fog(0x101c2d, 48, 92);
sc.add(new T.HemisphereLight(0xd8eaff, 0x293348, 2.25)); const k = new T.DirectionalLight(0xfff1d7, 2.65); k.position.set(-10, 21, 13); k.castShadow = true; Object.assign(k.shadow.camera, { left: -16, right: 16, top: 15, bottom: -15, near: 1, far: 55 }); sc.add(k);
const A = createArena(T, {}); sc.add(A); A.userData.setSkor(17, 24, 'Volley Club', 'Banteng Muda', 'SET 2');
const cam = new T.PerspectiveCamera(50, innerWidth / innerHeight, .1, 200); let yaw = .6, pit = .5, dist = 26, down = null;
const pos = () => { cam.position.set(Math.sin(yaw) * Math.cos(pit) * dist, Math.sin(pit) * dist + 1, Math.cos(yaw) * Math.cos(pit) * dist); cam.lookAt(0, 1.5, 0); };
addEventListener('pointerdown', e => down = [e.clientX, e.clientY]); addEventListener('pointerup', () => down = null);
addEventListener('pointermove', e => { if (!down) return; yaw -= (e.clientX - down[0]) * .006; pit = Math.max(.08, Math.min(1.3, pit + (e.clientY - down[1]) * .004)); down = [e.clientX, e.clientY]; });
addEventListener('wheel', e => dist = Math.max(8, Math.min(40, dist + e.deltaY * .02)));
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
document.getElementById('h').onclick = () => A.userData.hype = 1;
let t0 = performance.now(); (function f(n) { const dt = Math.min((n - t0) / 1000, .05); t0 = n; if (!down) yaw += dt * .05; A.userData.update(dt); pos(); R.render(sc, cam); requestAnimationFrame(f); })(t0);
</script></body></html>
